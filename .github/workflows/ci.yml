name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest -q

  extension:
    name: extension manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate extension/manifest.json
        run: |
          test -f extension/manifest.json && \
            node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json'))" || echo skip

      - name: Validate the OpenCode plugin parses
        run: |
          test -f opencode-plugin/agent-prompt-capture.js && \
            node --input-type=module --check < opencode-plugin/agent-prompt-capture.js || echo skip
