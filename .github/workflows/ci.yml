name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest -q

  extension:
    name: extension manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Both files are checked in, so a missing one is a bug, not a reason to skip:
      # `|| echo skip` used to swallow a malformed manifest as a green build.
      - name: Validate extension/manifest.json
        run: |
          test -f extension/manifest.json
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json'))"

      - name: Validate the OpenCode plugin parses
        run: |
          test -f opencode-plugin/agent-prompt-capture.js
          node --input-type=module --check < opencode-plugin/agent-prompt-capture.js

      # Pure-node unit tests for the two libraries the service worker shares
      # with the options page: no browser and no dependencies needed.
      - name: Extension unit tests
        run: |
          node extension/scripts/test-prescrub.js
          node extension/scripts/test-limits.js

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # smoke.mjs only falls back to /opt/pw-browsers (the shared pool on the dev
      # image) when this is unset and that directory exists. Pin it to a writable
      # path here so the browser the install step downloads is the one Playwright
      # then finds.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync dependencies
        run: uv sync --dev

      # The extension smoke test drives a real Chromium with the unpacked
      # extension loaded, so it needs a browser (not the headless shell) and a
      # display. `--with-deps` pulls the shared libraries Chromium needs on a
      # bare ubuntu-latest runner.
      - name: Install Chromium for Playwright
        run: |
          npm ci --prefix extension
          ./extension/node_modules/.bin/playwright install chromium --with-deps

      - name: Install xvfb
        run: sudo apt-get install -y --no-install-recommends xvfb

      # Chromium refuses to load an unpacked extension without a browser UI;
      # e2e.py -> smoke.mjs re-execs itself under xvfb-run, and running the
      # whole thing under xvfb-run makes that a no-op instead of a second layer.
      - name: End-to-end
        run: xvfb-run -a uv run python scripts/e2e.py
