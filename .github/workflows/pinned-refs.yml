name: Pinned refs

on:
  pull_request:
  push:
    branches:
      - claude/telemetry-mcp-prompt-logs-oyjojt

permissions:
  contents: read

jobs:
  pinned-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check images and actions are pinned
        run: python3 scripts/check_immutable_refs.py
